services:
  db:
    image: postgres:16
    container_name: movierizer_db_dev
    restart: always
    env_file:
      - ../.env
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    networks:
      - backend

  adminer:
    image: adminer
    container_name: movierizer_adminer_dev
    restart: always
    ports:
      - 8082:8080
    networks:
      - backend

networks:
  backend:
    name: backend
    driver: bridge

volumes:
  pgdata: