services:
  db:
    image: s0nren/movierizer-database:${DB_VERSION}
    container_name: movierizer_db
    restart: always
    env_file:
      - .env
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    networks:
      - backend

networks:
  backend:
    name: backend
    driver: bridge

volumes:
  pgdata: