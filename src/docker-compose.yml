services:
  db:
    image: postgres:16
    container_name: movierizer_db
    restart: always
    env_file:
      - .env
    ports:
      - "5432:5432"
    networks:
      - backend

  adminer:
    image: adminer
    restart: always
    ports:
      - 8081:8080
    networks:
      - backend

networks:
  backend:
    name: backend
    driver: bridge